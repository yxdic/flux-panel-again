name: Validate Xray upgrade and panel fixes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nextjs-frontend/package-lock.json
      - name: Install dependencies
        working-directory: nextjs-frontend
        run: npm ci
      - name: Build frontend
        working-directory: nextjs-frontend
        run: npm run build
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [go-node, go-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: Go tests
        working-directory: ${{ matrix.module }}
        run: go test ./...
      - name: Compile Linux amd64
        working-directory: ${{ matrix.module }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...
  xray-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundled version and official release artifacts
        run: |
          set -euo pipefail
          grep -q 'ARG XRAY_VERSION=26.6.27' go-node/Dockerfile
          grep -q 'ARG XRAY_VERSION=26.6.27' go-node/Dockerfile.binary
          for arch in 64 arm64-v8a; do
            curl -fIL --retry 3 --connect-timeout 15 --max-time 90 "https://github.com/XTLS/Xray-core/releases/download/v26.6.27/Xray-linux-${arch}.zip"
          done
